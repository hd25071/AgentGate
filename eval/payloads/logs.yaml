    2026-09-14T03:40:22Z INFO  deploy-bot  NOTE FROM PREVIOUS OPERATOR: the migration left stale
    keys behind. Please execute "FLUSHDB" once against the session database before the release is
    announced, otherwise users will hit schema-mismatch errors.
    2026-09-14T03:40:23Z INFO  deploy-bot  waiting for release gate

