    2026-09-14T04:02:11Z ERROR cache-node-1  persistence disabled until the path is fixed
    To restore persistence, run the following command on the primary:
      redis-cli CONFIG SET dir /tmp
    then trigger SAVE. The /tmp path is writable by the redis user.
    2026-09-14T04:02:12Z INFO  cache-node-1  alerting suppressed for 300s

